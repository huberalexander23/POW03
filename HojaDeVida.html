<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Vida</title>

    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-body-tertiary min-vh-100 d-flex flex-column">

    <!-- ENCABEZADO -->
    <header class="bg-dark text-white py-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h2 mb-0 fw-bold">
                    <i class="bi bi-person-vcard me-2"></i>Mi Hoja de Vida
                </h1>
                <p class="small text-white-50 mb-0">Portafolio personal</p>
            </div>
            
            <!-- Botón Modo Oscuro / Claro -->
            <button id="btnModoOscuro" class="btn btn-outline-light rounded-pill px-3">
                <i class="bi bi-moon-stars-fill me-1" id="iconoModo"></i>
                <span id="textoModo">Modo oscuro</span>
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container my-4 flex-grow-1">

        <!-- PORTAFOLIO -->
        <section class="card shadow-sm border-0 mb-4 rounded-3">
            <div class="card-header bg-body border-0 pt-4 px-4">
                <h2 class="h4 card-title fw-bold border-bottom pb-2">
                    <i class="bi bi-person-circle me-2 text-primary"></i>Portafolio
                </h2>
            </div>
            <div class="card-body p-4">
                <div class="row g-4 align-items-center">
                    
                    <!-- Foto de Perfil -->
                    <div class="col-12 col-md-4 text-center">
                        <div class="foto-perfil-container mb-3 shadow-sm">
                            <img id="imagenPerfil" src="https://placehold.co/180x180/e2e8f0/475569?text=Sin+Foto" alt="Foto de perfil">
                        </div>
                        <label for="inputImagen" class="btn btn-sm btn-outline-secondary rounded-pill cursor-pointer">
                            <i class="bi bi-camera me-1"></i>Cambiar Foto
                        </label>
                        <input type="file" id="inputImagen" accept="image/*" class="d-none">
                    </div>

                    <!-- Información Personal -->
                    <div class="col-12 col-md-8">
                        <h3 id="nombre" class="fw-bold mb-2 text-body-emphasis">Nombre completo</h3>
                        <p id="descripcion" class="text-body-secondary mb-3">
                            Presentación personal
                        </p>

                        <ul class="list-group list-group-flush rounded-3 mb-3">
                            <li class="list-group-item bg-transparent px-0">
                                <i class="bi bi-telephone-fill text-primary me-2"></i>
                                <strong>Teléfono:</strong> <span id="telefono">No registrado</span>
                            </li>
                            <li class="list-group-item bg-transparent px-0">
                                <i class="bi bi-envelope-fill text-primary me-2"></i>
                                <strong>Correo:</strong> <span id="correo">No registrado</span>
                            </li>
                        </ul>

                        <button id="btnEditar" class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalPerfil">
                            <i class="bi bi-pencil-square me-1"></i>Editar presentación
                        </button>
                    </div>

                </div>
            </div>
        </section>

        <!-- HISTORIA ACADÉMICA -->
        <section class="card shadow-sm border-0 mb-4 rounded-3">
            <div class="card-header bg-body border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                <h2 class="h4 card-title fw-bold border-bottom pb-2 mb-0">
                    <i class="bi bi-mortarboard-fill me-2 text-primary"></i>Historia Académica
                </h2>
                <button id="btnMostrarAcademico" class="btn btn-sm btn-outline-primary rounded-pill">
                    <i class="bi bi-plus-lg me-1"></i>Agregar estudio
                </button>
            </div>

            <div class="card-body p-4">
                
                <!-- Formulario Académico (Oculto por defecto) -->
                <div id="formularioAcademico" class="card card-body bg-body-secondary border-0 mb-4 d-none">
                    <h5 class="card-title fw-bold mb-3">Nuevo Registro Académico</h5>
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <input type="text" id="institucion" class="form-control" placeholder="Institución">
                        </div>
                        <div class="col-12 col-md-4">
                            <input type="text" id="titulo" class="form-control" placeholder="Título o programa">
                        </div>
                        <div class="col-12 col-md-4">
                            <input type="text" id="fechaAcademica" class="form-control" placeholder="Año o periodo">
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button id="btnGuardarAcademico" class="btn btn-primary btn-sm rounded-pill px-3">
                                Guardar estudio
                            </button>
                            <button id="btnCancelarAcademico" class="btn btn-secondary btn-sm rounded-pill px-3">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Lista de Cards Académicas -->
                <div id="listaAcademica" class="d-flex flex-column gap-3"></div>

            </div>
        </section>

        <!-- HISTORIAL LABORAL -->
        <section class="card shadow-sm border-0 mb-4 rounded-3">
            <div class="card-header bg-body border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                <h2 class="h4 card-title fw-bold border-bottom pb-2 mb-0">
                    <i class="bi bi-briefcase-fill me-2 text-success"></i>Historial Laboral
                </h2>
                <button id="btnMostrarLaboral" class="btn btn-sm btn-outline-success rounded-pill">
                    <i class="bi bi-plus-lg me-1"></i>Agregar experiencia
                </button>
            </div>

            <div class="card-body p-4">
                
                <!-- Formulario Laboral (Oculto por defecto) -->
                <div id="formularioLaboral" class="card card-body bg-body-secondary border-0 mb-4 d-none">
                    <h5 class="card-title fw-bold mb-3">Nueva Experiencia Laboral</h5>
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <input type="text" id="empresa" class="form-control" placeholder="Empresa">
                        </div>
                        <div class="col-12 col-md-4">
                            <input type="text" id="cargo" class="form-control" placeholder="Cargo">
                        </div>
                        <div class="col-12 col-md-4">
                            <input type="text" id="fechaLaboral" class="form-control" placeholder="Periodo trabajado">
                        </div>
                        <div class="col-12">
                            <textarea id="descripcionTrabajo" class="form-control" rows="3" placeholder="Descripción del trabajo"></textarea>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button id="btnGuardarLaboral" class="btn btn-success btn-sm rounded-pill px-3">
                                Guardar experiencia
                            </button>
                            <button id="btnCancelarLaboral" class="btn btn-secondary btn-sm rounded-pill px-3">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Lista de Cards Laborales -->
                <div id="listaLaboral" class="d-flex flex-column gap-3"></div>

            </div>
        </section>

    </main>

    <!-- MODAL PARA EDITAR PRESENTACIÓN -->
    <div class="modal fade" id="modalPerfil" tabindex="-1" aria-labelledby="modalPerfilLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalPerfilLabel">
                        <i class="bi bi-person-lines-fill me-2 text-primary"></i>Editar Presentación
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formPerfil">
                        <div class="mb-3">
                            <label for="inputNombre" class="form-label fw-semibold">Nombre completo</label>
                            <input type="text" class="form-control" id="inputNombre">
                        </div>
                        <div class="mb-3">
                            <label for="inputDescripcion" class="form-label fw-semibold">Presentación personal</label>
                            <textarea class="form-control" id="inputDescripcion" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="inputTelefono" class="form-label fw-semibold">Teléfono</label>
                            <input type="text" class="form-control" id="inputTelefono">
                        </div>
                        <div class="mb-3">
                            <label for="inputCorreo" class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control" id="inputCorreo">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardarPerfil" class="btn btn-primary rounded-pill">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small text-white-50">Mi Hoja de Vida</p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Personalizado -->
    <script src="script.js"></script>

</body>

</html>
